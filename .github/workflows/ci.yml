name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep CI aligned with docs/release/environment.md.
  NODE_VERSION: '24.3.0'
  RUST_VERSION: '1.88.0'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      # Both boundaries are enforced by scripts, not convention: no direct Base UI
      # imports or raw interactive controls outside packages/ui, and no stale
      # generated Protobuf bindings.
      - name: UI boundary
        run: pnpm check:ui-boundary

      - name: Protocol generation freshness
        run: pnpm check:protocol-generation

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The control-plane PostgreSQL suite is opt-in and skips without
      # HQ_CONTROL_PLANE_TEST_DATABASE_URL, so this stays offline and deterministic.
      - name: Test
        run: pnpm test

      - name: Build (web)
        run: pnpm build:web

      - name: Build (desktop static export)
        run: pnpm build:desktop:web

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @gremuchaya/hq exec playwright install --with-deps chromium

      - name: Run end-to-end suite
        run: pnpm test:ui

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/hq/playwright-report/
          retention-days: 7

  rust:
    name: Rust (Tauri shell)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      # Tauri needs system libraries even for a check-only build on Linux.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/hq/src-tauri

      - name: Format
        run: cargo fmt --manifest-path apps/hq/src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path apps/hq/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path apps/hq/src-tauri/Cargo.toml
