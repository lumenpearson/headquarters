[package]
name = "gremuchaya-hq"
version = "0.5.0"
description = "Native production shell for Gremuchaya HQ"
authors = ["Gremuchaya HQ Production"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "gremuchaya_hq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "=1.12.1"
getrandom = "=0.4.3"
hex = "=0.4.3"
http-body-util = "=0.1.5"
# `hyper` and `hyper-util` are already in the dependency graph (Tauri itself
# pulls a client through them); pinning them as direct dependencies here just
# names what `control_plane_proxy` already relies on transitively, rather
# than introducing a new crate. `client-legacy` + `http1` is the same client
# shape `axum`'s own HTTP1 server side already uses elsewhere in this crate.
hyper = { version = "=1.11.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["client-legacy", "http1", "tokio"] }
notify = "8.2.0"
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "net", "process", "sync", "time"] }
tower-http = { version = "=0.7.0", features = ["cors"] }
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_SystemInformation",
] }
