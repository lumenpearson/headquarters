[package]
name = "gremuchaya-hq"
version = "0.5.0"
description = "Native production shell for Gremuchaya HQ"
authors = ["Gremuchaya HQ Production"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "gremuchaya_hq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "=0.4.3"
hex = "=0.4.3"
notify = "8.2.0"
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
thiserror = "2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "net", "process", "sync", "time"] }
tower-http = { version = "=0.7.0", features = ["cors"] }
url = "=2.5.8"
