syntax = "proto3";

package gremuchaya.sync.v1;

import "google/protobuf/timestamp.proto";
import "gremuchaya/common/v1/common.proto";

enum DeviceRole {
  DEVICE_ROLE_UNSPECIFIED = 0;
  DEVICE_ROLE_VIEWER = 1;
  DEVICE_ROLE_EDITOR = 2;
  DEVICE_ROLE_ADMIN = 3;
}

enum AuthorityMode {
  AUTHORITY_MODE_UNSPECIFIED = 0;
  AUTHORITY_MODE_LEADER = 1;
  AUTHORITY_MODE_MULTI_AUTHORITY = 2;
}

enum DeviceStatus {
  DEVICE_STATUS_UNSPECIFIED = 0;
  DEVICE_STATUS_OFFLINE = 1;
  DEVICE_STATUS_ONLINE = 2;
  DEVICE_STATUS_REVOKED = 3;
}

message Group {
  gremuchaya.common.v1.ResourceId id = 1;
  string name = 2;
  AuthorityMode authority_mode = 3;
  gremuchaya.common.v1.ResourceId leader_device_id = 4;
  gremuchaya.common.v1.Revision revision = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message Device {
  gremuchaya.common.v1.ResourceId id = 1;
  string name = 2;
  string public_key = 3;
  DeviceRole role = 4;
  DeviceStatus status = 5;
  string platform = 6;
  string application_version = 7;
  google.protobuf.Timestamp last_seen_at = 8;
}

// Opaque credentials are intentionally returned only by bootstrap, pairing and
// refresh responses. They must never be persisted in UI state, URLs or logs.
message DeviceSession {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp access_token_expires_at = 3;
  google.protobuf.Timestamp refresh_token_expires_at = 4;
  gremuchaya.common.v1.ResourceId device_id = 5;
  gremuchaya.common.v1.ResourceId group_id = 6;
  DeviceRole role = 7;
}

message PairingCode {
  string code = 1;
  gremuchaya.common.v1.ResourceId group_id = 2;
  DeviceRole role = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message Presence {
  gremuchaya.common.v1.ResourceId device_id = 1;
  DeviceStatus status = 2;
  string active_screen = 3;
  string selected_element = 4;
  int64 clock_offset_ms = 5;
  uint32 latency_ms = 6;
  google.protobuf.Timestamp observed_at = 7;
}

// What a device reports about itself, as opposed to what the server decides.
//
// `Presence` carries seven fields and a device may only ever speak for four of
// them: `device_id` comes from the bearer token, `status` from whether the
// device joined or left, and `observed_at` from the server clock. Declaring the
// reportable four as their own message is what keeps a client from appearing to
// be able to set the other three — and lets the same four travel on a join and
// on every later report without being written twice.
//
// The field numbers deliberately do not mirror `Presence`: this is a separate
// message, and matching numbers across two messages is a coincidence a reader
// would come to rely on.
message PresenceDetail {
  // The screen this device is showing, as the client's own route identifier.
  string active_screen = 1;
  // The element the operator has selected on that screen, or empty for none.
  string selected_element = 2;
  // The offset this device believes its clock has from the server's, as
  // `TimeSync` estimated it. Signed, because a device may be behind or ahead.
  int64 clock_offset_ms = 3;
  // The round trip this device last measured. Unsigned, because a latency is
  // not negative; the server bounds it, since the column that stores it is
  // narrower than this type.
  uint32 latency_ms = 4;
}

message CreateGroupRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  string name = 2;
  Device initial_device = 3;
}

message CreateGroupResponse {
  Group group = 1;
  Device device = 2;
  DeviceSession session = 3;
}

message UpdateGroupRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  gremuchaya.common.v1.ResourceId group_id = 2;
  string name = 3;
}

message UpdateGroupResponse {
  Group group = 1;
}

message CreatePairingCodeRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  gremuchaya.common.v1.ResourceId group_id = 2;
  DeviceRole role = 3;
}

message CreatePairingCodeResponse {
  PairingCode pairing_code = 1;
}

message PairDeviceRequest {
  string pairing_code = 1;
  string device_name = 2;
  string public_key = 3;
  string platform = 4;
  string application_version = 5;
  // Permits a client to safely identify a retry without placing credentials in
  // a URL. The server persists only an idempotency receipt fingerprint.
  gremuchaya.common.v1.MutationContext context = 6;
}

message PairDeviceResponse {
  Group group = 1;
  Device device = 2;
  string access_token = 3 [deprecated = true];
  string refresh_token = 4 [deprecated = true];
  google.protobuf.Timestamp access_token_expires_at = 5 [deprecated = true];
  DeviceSession session = 6;
}

message RefreshDeviceSessionRequest {
  string refresh_token = 1;
  // Refresh rotation is destructive for the previous token, so retries need a
  // request identifier once durable receipts are enabled.
  gremuchaya.common.v1.MutationContext context = 2;
}

message RefreshDeviceSessionResponse {
  DeviceSession session = 1;
}

message ListDevicesRequest {
  gremuchaya.common.v1.ResourceId group_id = 1;
  gremuchaya.common.v1.PageRequest page = 2;
}

message ListDevicesResponse {
  repeated Device devices = 1;
  gremuchaya.common.v1.PageInfo page = 2;
}

message RevokeDeviceRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  gremuchaya.common.v1.ResourceId group_id = 2;
  gremuchaya.common.v1.ResourceId device_id = 3;
}

message RevokeDeviceResponse {
  gremuchaya.common.v1.OperationResult result = 1;
}

message JoinGroupRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  gremuchaya.common.v1.ResourceId group_id = 2;
  // What this device is looking at as it joins. Optional, and absent means the
  // four fields are reported empty rather than left at whatever a previous
  // session of the same device happened to leave behind: a join is a new
  // participation, so it may not inherit a stale screen.
  //
  // It travels on the join rather than in a call of its own because the join
  // already publishes `PRESENCE_UPDATED`; a separate first report would append
  // a second row to the group log saying what the first one could have said.
  PresenceDetail detail = 3;
}

message JoinGroupResponse {
  Group group = 1;
}

message LeaveGroupRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  gremuchaya.common.v1.ResourceId group_id = 2;
}

message LeaveGroupResponse {
  gremuchaya.common.v1.OperationResult result = 1;
}

message SetDeviceRoleRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  gremuchaya.common.v1.ResourceId group_id = 2;
  gremuchaya.common.v1.ResourceId device_id = 3;
  DeviceRole role = 4;
}

message SetDeviceRoleResponse {
  Device device = 1;
}

message SetAuthorityModeRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  gremuchaya.common.v1.ResourceId group_id = 2;
  AuthorityMode mode = 3;
}

message SetAuthorityModeResponse {
  Group group = 1;
}

message SetLeaderRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  gremuchaya.common.v1.ResourceId group_id = 2;
  gremuchaya.common.v1.ResourceId device_id = 3;
}

message SetLeaderResponse {
  Group group = 1;
}

enum SynchronizedDocumentType {
  SYNCHRONIZED_DOCUMENT_TYPE_UNSPECIFIED = 0;
  SYNCHRONIZED_DOCUMENT_TYPE_LAYOUT = 1;
  SYNCHRONIZED_DOCUMENT_TYPE_SETTINGS = 2;
  SYNCHRONIZED_DOCUMENT_TYPE_CONTENT = 3;
  SYNCHRONIZED_DOCUMENT_TYPE_KEYMAP = 4;
  SYNCHRONIZED_DOCUMENT_TYPE_SIMULATION = 5;
}

message PublishDocumentDeltaRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  gremuchaya.common.v1.ResourceId group_id = 2;
  gremuchaya.common.v1.ResourceId document_id = 3;
  SynchronizedDocumentType document_type = 4;
  bytes state_vector = 5;
  bytes delta = 6;
  uint64 hybrid_logical_clock = 7;
}

message PublishDocumentDeltaResponse {
  uint64 sequence = 1;
  bytes state_vector = 2;
}

enum SessionCommandAction {
  SESSION_COMMAND_ACTION_UNSPECIFIED = 0;
  SESSION_COMMAND_ACTION_NAVIGATE = 1;
  SESSION_COMMAND_ACTION_SELECT = 2;
  SESSION_COMMAND_ACTION_PLAY = 3;
  SESSION_COMMAND_ACTION_PAUSE = 4;
  SESSION_COMMAND_ACTION_SEEK = 5;
  SESSION_COMMAND_ACTION_SET_RATE = 6;
  SESSION_COMMAND_ACTION_SET_SCENE = 7;
}

message SessionCommand {
  uint64 epoch = 1;
  uint64 sequence = 2;
  SessionCommandAction action = 3;
  string target = 4;
  double position_seconds = 5;
  double playback_rate = 6;
  google.protobuf.Timestamp execute_at = 7;
  gremuchaya.common.v1.ResourceId issued_by_device_id = 8;
}

message PublishSessionCommandRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  gremuchaya.common.v1.ResourceId group_id = 2;
  SessionCommand command = 3;
}

message PublishSessionCommandResponse {
  SessionCommand command = 1;
}

message TimeSyncRequest {
  gremuchaya.common.v1.ResourceId group_id = 1;
  uint64 client_send_monotonic_ms = 2;
  google.protobuf.Timestamp client_wall_time = 3;
}

message TimeSyncResponse {
  uint64 client_send_monotonic_ms = 1;
  google.protobuf.Timestamp server_receive_time = 2;
  google.protobuf.Timestamp server_send_time = 3;
}

message GetPresenceRequest {
  gremuchaya.common.v1.ResourceId group_id = 1;
}

message GetPresenceResponse {
  repeated Presence devices = 1;
}

// Reports what this device is looking at, after it has already joined.
//
// The device is never named: like `GetPresenceRequest` this message carries no
// device field at all, so the row a report can reach is only the one the bearer
// token authenticated. A caller therefore cannot describe another operator's
// screen, and cannot make a device that never joined appear present.
message UpdatePresenceRequest {
  // Carried for the actor check every mutating call in this service makes. It
  // needs no idempotency receipt: a report replaces the four fields outright,
  // so a retry and the call it retries leave the same row.
  gremuchaya.common.v1.MutationContext context = 1;
  gremuchaya.common.v1.ResourceId group_id = 2;
  PresenceDetail detail = 3;
}

// The group's presence after the report, which is the same list `GetPresence`
// answers. A reporting client would otherwise have to make two calls to learn
// the effect of its own, and each of those calls renews liveness — so the pair
// would cost twice what one does.
message UpdatePresenceResponse {
  repeated Presence devices = 1;
}

message WatchGroupRequest {
  gremuchaya.common.v1.ResourceId group_id = 1;
  uint64 after_sequence = 2;
  bytes document_state_vector = 3;
}

enum GroupEventKind {
  GROUP_EVENT_KIND_UNSPECIFIED = 0;
  GROUP_EVENT_KIND_GROUP_UPDATED = 1;
  GROUP_EVENT_KIND_DEVICE_UPDATED = 2;
  GROUP_EVENT_KIND_PRESENCE_UPDATED = 3;
  GROUP_EVENT_KIND_DOCUMENT_DELTA = 4;
  GROUP_EVENT_KIND_SESSION_COMMAND = 5;
  // Declared, and deliberately published by nothing.
  //
  // Whether a resume point is still answerable is a verdict about one reader:
  // it compares that caller's `after_sequence` against the oldest sequence the
  // group still retains. A `GroupEvent` is the opposite — one row of the
  // group's log, delivered in order to every reader alike — so it cannot carry
  // the verdict. Appended at the head it would reach readers whose cursor is
  // perfectly current and tell them to discard a history they still have; and
  // it would lengthen the very log whose length is the problem.
  //
  // The two transports that answer a resume report it out of band and to the
  // one caller who asked: `gremuchaya.realtime.v1.ResyncRequired` on the
  // socket, and `ReadGroupEventsResponse.resync_required` on the page. Both
  // read the same decision, so a deployment serving both cannot disagree with
  // itself; a third copy of the rule inside the log would have no such
  // guarantee.
  //
  // The value stays because removing one from a versioned enum is its own
  // compatibility decision, and because a client must keep decoding a kind
  // some future server might have reason to send.
  GROUP_EVENT_KIND_SNAPSHOT_REQUIRED = 6;
}

message GroupEvent {
  uint64 sequence = 1;
  GroupEventKind kind = 2;
  Group group = 3;
  Device device = 4;
  Presence presence = 5;
  gremuchaya.common.v1.ResourceId document_id = 6;
  bytes document_delta = 7;
  SessionCommand session_command = 8;
  google.protobuf.Timestamp occurred_at = 9;
  // Who caused the event. `device` names the device an event is *about*, which
  // for a role change is not the administrator who made it. Without this a
  // subscriber cannot recognise the echo of its own publication.
  gremuchaya.common.v1.ResourceId actor_device_id = 10;
  // The publisher's hybrid logical clock. It is stored per event and has to
  // reach subscribers for a CRDT to order concurrent deltas.
  uint64 hybrid_logical_clock = 11;
}

// The document state a client falls back to when its resume point is no longer
// retained. Both `ResyncRequired` and `GROUP_EVENT_KIND_SNAPSHOT_REQUIRED` tell
// a client it needs one; this is how it asks.
message GetDocumentSnapshotRequest {
  gremuchaya.common.v1.ResourceId group_id = 1;
  gremuchaya.common.v1.ResourceId document_id = 2;
}

message GetDocumentSnapshotResponse {
  bytes snapshot = 1;
  bytes state_vector = 2;
  // The event sequence the snapshot was taken at. A client resumes the log from
  // here, so a snapshot with no sequence would leave it unable to catch up.
  uint64 sequence = 3;
  SynchronizedDocumentType document_type = 4;
}

message WatchGroupResponse {
  GroupEvent event = 1;
}

// A page of the group log, read on demand.
//
// This is not a second `WatchGroup`. `WatchGroup` means "push what arrives" and
// needs the process-local listener set of the realtime hub; a deployment that
// answers one request on one instance and the next on another cannot keep that
// set, and a socket admitted there would report itself live while following
// nothing. This method means "give me the page after N" and needs no hub at
// all, which is what makes the log readable from a serverless deployment.
message ReadGroupEventsRequest {
  gremuchaya.common.v1.ResourceId group_id = 1;
  // The last sequence the caller already holds. Zero asks for the log from its
  // beginning, which is the proto3 default and also the honest one: sequences
  // start at one.
  uint64 after_sequence = 2;
  // How many events at most. Zero means the server default. A value above the
  // retained-window ceiling is refused rather than clamped, because a clamp
  // looks like a short page and a client would stop paging.
  uint32 limit = 3;
}

message ReadGroupEventsResponse {
  repeated GroupEvent events = 1;
  // The oldest sequence the group still retains, or zero when the store
  // reported no edge, which it does exactly when nothing sits above the
  // requested cursor. Zero is never a real sequence, so it cannot be mistaken
  // for one.
  uint64 earliest_available_sequence = 2;
  // Whether the log holds anything beyond the last event of this page.
  bool has_more = 3;
  // The retained window no longer covers the requested cursor, so the caller
  // needs `GetDocumentSnapshot` rather than more pages. It is the same decision
  // the realtime hub reports as `gremuchaya.realtime.v1.ResyncRequired`, taken
  // by the same function, and it travels as a field rather than an error so a
  // client that fell behind is not told its request was malformed.
  bool resync_required = 4;
}

service SyncService {
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
  rpc CreatePairingCode(CreatePairingCodeRequest) returns (CreatePairingCodeResponse);
  rpc PairDevice(PairDeviceRequest) returns (PairDeviceResponse);
  rpc RefreshDeviceSession(RefreshDeviceSessionRequest) returns (RefreshDeviceSessionResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  rpc JoinGroup(JoinGroupRequest) returns (JoinGroupResponse);
  rpc LeaveGroup(LeaveGroupRequest) returns (LeaveGroupResponse);
  rpc SetDeviceRole(SetDeviceRoleRequest) returns (SetDeviceRoleResponse);
  rpc SetAuthorityMode(SetAuthorityModeRequest) returns (SetAuthorityModeResponse);
  rpc SetLeader(SetLeaderRequest) returns (SetLeaderResponse);
  rpc PublishDocumentDelta(PublishDocumentDeltaRequest) returns (PublishDocumentDeltaResponse);
  rpc PublishSessionCommand(PublishSessionCommandRequest) returns (PublishSessionCommandResponse);
  rpc TimeSync(TimeSyncRequest) returns (TimeSyncResponse);
  rpc GetPresence(GetPresenceRequest) returns (GetPresenceResponse);
  // Reports the caller's own presence detail and reads the group's presence
  // back. It publishes no `PRESENCE_UPDATED` event: a screen change is as
  // frequent as navigation, and an event per change would append a durable row
  // and spend a sequence number every time — the same log growth that keeps
  // liveness renewal out of `JoinGroup`. Neighbours pick the detail up from
  // their own presence read, which they already make on a timer.
  rpc UpdatePresence(UpdatePresenceRequest) returns (UpdatePresenceResponse);
  rpc WatchGroup(WatchGroupRequest) returns (stream WatchGroupResponse);
  rpc ReadGroupEvents(ReadGroupEventsRequest) returns (ReadGroupEventsResponse);
  rpc GetDocumentSnapshot(GetDocumentSnapshotRequest) returns (GetDocumentSnapshotResponse);
}
