syntax = "proto3";

package gremuchaya.settings.v1;

import "google/protobuf/timestamp.proto";
import "gremuchaya/common/v1/common.proto";

enum SettingsScopeType {
  SETTINGS_SCOPE_TYPE_UNSPECIFIED = 0;
  SETTINGS_SCOPE_TYPE_FACTORY = 1;
  SETTINGS_SCOPE_TYPE_THEME = 2;
  SETTINGS_SCOPE_TYPE_GROUP = 3;
  SETTINGS_SCOPE_TYPE_DEVICE = 4;
  SETTINGS_SCOPE_TYPE_LOCAL_DRAFT = 5;
  SETTINGS_SCOPE_TYPE_SESSION_PREVIEW = 6;
}

message SettingsScope {
  SettingsScopeType type = 1;
  gremuchaya.common.v1.ResourceId resource_id = 2;
}

enum SettingValueType {
  SETTING_VALUE_TYPE_UNSPECIFIED = 0;
  SETTING_VALUE_TYPE_STRING = 1;
  SETTING_VALUE_TYPE_INTEGER = 2;
  SETTING_VALUE_TYPE_NUMBER = 3;
  SETTING_VALUE_TYPE_BOOLEAN = 4;
  SETTING_VALUE_TYPE_BINARY = 5;
  SETTING_VALUE_TYPE_STRING_LIST = 6;
}

message SettingConstraint {
  double minimum = 1;
  double maximum = 2;
  double step = 3;
  uint32 maximum_length = 4;
  repeated string allowed_values = 5;
}

message SettingDescriptor {
  string path = 1;
  string category = 2;
  string localization_key = 3;
  SettingValueType value_type = 4;
  gremuchaya.common.v1.SettingValue default_value = 5;
  SettingConstraint constraint = 6;
  bool group_sync_allowed = 7;
  bool requires_restart = 8;
}

message SettingsSchema {
  string version = 1;
  repeated SettingDescriptor settings = 2;
  repeated string categories = 3;
}

message SettingsDocument {
  gremuchaya.common.v1.ResourceId id = 1;
  SettingsScope scope = 2;
  map<string, gremuchaya.common.v1.SettingValue> values = 3;
  gremuchaya.common.v1.Revision revision = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message SettingsPatchOperation {
  string path = 1;
  gremuchaya.common.v1.SettingValue value = 2;
  bool remove = 3;
}

message SettingsHistoryEntry {
  gremuchaya.common.v1.ResourceId id = 1;
  SettingsScope scope = 2;
  string category = 3;
  string element_id = 4;
  string operation = 5;
  repeated SettingsPatchOperation patch = 6;
  gremuchaya.common.v1.Revision revision = 7;
  gremuchaya.common.v1.ResourceId actor_device_id = 8;
  google.protobuf.Timestamp occurred_at = 9;
  string correlation_id = 10;
}

message GetEffectiveSettingsRequest {
  gremuchaya.common.v1.ResourceId group_id = 1;
  gremuchaya.common.v1.ResourceId device_id = 2;
  bool include_draft = 3;
}

message GetEffectiveSettingsResponse {
  SettingsDocument document = 1;
  repeated SettingsScope contributing_scopes = 2;
}

message GetSettingsSchemaRequest {
  string version = 1;
}

message GetSettingsSchemaResponse {
  SettingsSchema schema = 1;
}

message ApplyDraftPatchRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  SettingsScope scope = 2;
  repeated SettingsPatchOperation operations = 3;
}

message ApplyDraftPatchResponse {
  SettingsDocument draft = 1;
}

message DiscardDraftRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  SettingsScope scope = 2;
}

message DiscardDraftResponse {
  SettingsDocument effective = 1;
}

message PublishDraftRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  SettingsScope scope = 2;
}

message PublishDraftResponse {
  SettingsDocument published = 1;
}

message ResetCategoryRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  SettingsScope scope = 2;
  string category = 3;
}

message ResetCategoryResponse {
  SettingsDocument document = 1;
}

message ResetElementRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  SettingsScope scope = 2;
  string element_id = 3;
}

message ResetElementResponse {
  SettingsDocument document = 1;
}

message ResetAllRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  SettingsScope scope = 2;
  string confirmation = 3;
}

message ResetAllResponse {
  SettingsDocument document = 1;
}

message ExportSettingsRequest {
  SettingsScope scope = 1;
}

message ExportSettingsResponse {
  bytes payload = 1;
  string media_type = 2;
  string schema_version = 3;
  string checksum = 4;
}

message ImportSettingsRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  SettingsScope scope = 2;
  bytes payload = 3;
  string media_type = 4;
  bool dry_run = 5;
}

message ImportSettingsResponse {
  SettingsDocument document = 1;
  repeated gremuchaya.common.v1.FieldViolation violations = 2;
}

message RevertSettingsVersionRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  SettingsScope scope = 2;
  gremuchaya.common.v1.Revision target_revision = 3;
}

message RevertSettingsVersionResponse {
  SettingsDocument document = 1;
}

message ListSettingsHistoryRequest {
  SettingsScope scope = 1;
  gremuchaya.common.v1.PageRequest page = 2;
}

message ListSettingsHistoryResponse {
  repeated SettingsHistoryEntry entries = 1;
  gremuchaya.common.v1.PageInfo page = 2;
}

message WatchSettingsRequest {
  SettingsScope scope = 1;
  uint64 after_revision = 2;
}

enum SettingsEventKind {
  SETTINGS_EVENT_KIND_UNSPECIFIED = 0;
  SETTINGS_EVENT_KIND_DRAFT_UPDATED = 1;
  SETTINGS_EVENT_KIND_DRAFT_DISCARDED = 2;
  SETTINGS_EVENT_KIND_PUBLISHED = 3;
  SETTINGS_EVENT_KIND_RESET = 4;
  SETTINGS_EVENT_KIND_REVERTED = 5;
}

message SettingsEvent {
  uint64 sequence = 1;
  SettingsEventKind kind = 2;
  SettingsScope scope = 3;
  SettingsDocument document = 4;
  google.protobuf.Timestamp occurred_at = 5;
  string correlation_id = 6;
}

message WatchSettingsResponse {
  SettingsEvent event = 1;
}

// One tile's place on a screen, as a layout document records it.
//
// The geometry is the bounded grid `@gremuchaya/layout-engine` packs: a column
// and a row, and how many of each the tile spans. It is a typed message rather
// than an opaque blob so the stored document can be read back by anything that
// speaks this contract, and so a malformed placement is refused by the wire
// decoder rather than by whichever screen tried to draw it.
message LayoutTilePlacement {
  string tile_id = 1;
  uint32 column = 2;
  uint32 row = 3;
  uint32 column_span = 4;
  uint32 row_span = 5;
  // A tile the operator hid on this screen. It keeps its place so unhiding it
  // does not move every other tile.
  bool hidden = 6;
}

// The arrangement of one screen, under one scope.
//
// A layout belongs to a `SettingsScope` for the same reason a settings document
// does: a group agrees on how its wall is arranged, and a device may arrange
// its own. `FACTORY` and `THEME` have no layout — a scope with no home in
// `layout_documents` is refused rather than invented.
message LayoutDocument {
  gremuchaya.common.v1.ResourceId id = 1;
  SettingsScope scope = 2;
  string screen_id = 3;
  repeated LayoutTilePlacement tiles = 4;
  gremuchaya.common.v1.Revision revision = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// Replaces a screen's layout with the tiles the caller sends.
//
// The whole arrangement travels, not a delta: a layout is small, and a CRDT
// merge would need an engine this control plane deliberately does not carry
// (correction C32). `expected_revision` is what keeps a whole-document put from
// being a lost-update generator — a caller that names the revision it edited is
// refused when another device has moved the document since, instead of
// silently overwriting that device's arrangement. Zero means "whatever is
// there", which is the honest value for the first put of a screen.
message PutLayoutDocumentRequest {
  gremuchaya.common.v1.MutationContext context = 1;
  SettingsScope scope = 2;
  string screen_id = 3;
  repeated LayoutTilePlacement tiles = 4;
  gremuchaya.common.v1.Revision expected_revision = 5;
}

message PutLayoutDocumentResponse {
  LayoutDocument document = 1;
}

message GetLayoutDocumentRequest {
  SettingsScope scope = 1;
  string screen_id = 2;
}

message GetLayoutDocumentResponse {
  // Absent when this scope has never arranged this screen. An absent document
  // is not an error: it is the state every screen starts in, and reporting it
  // as `NOT_FOUND` would make a first-run client treat a normal condition as a
  // failure.
  LayoutDocument document = 1;
}

// One recorded revision of a layout, as `layout_versions` holds it.
message LayoutHistoryEntry {
  gremuchaya.common.v1.Revision revision = 1;
  repeated LayoutTilePlacement tiles = 2;
  gremuchaya.common.v1.ResourceId actor_device_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
  string correlation_id = 5;
}

message ListLayoutHistoryRequest {
  SettingsScope scope = 1;
  string screen_id = 2;
  gremuchaya.common.v1.PageRequest page = 3;
}

message ListLayoutHistoryResponse {
  repeated LayoutHistoryEntry entries = 1;
  gremuchaya.common.v1.PageInfo page = 2;
}

service SettingsService {
  rpc GetEffectiveSettings(GetEffectiveSettingsRequest) returns (GetEffectiveSettingsResponse);
  rpc GetSettingsSchema(GetSettingsSchemaRequest) returns (GetSettingsSchemaResponse);
  rpc ApplyDraftPatch(ApplyDraftPatchRequest) returns (ApplyDraftPatchResponse);
  rpc DiscardDraft(DiscardDraftRequest) returns (DiscardDraftResponse);
  rpc PublishDraft(PublishDraftRequest) returns (PublishDraftResponse);
  rpc ResetCategory(ResetCategoryRequest) returns (ResetCategoryResponse);
  rpc ResetElement(ResetElementRequest) returns (ResetElementResponse);
  rpc ResetAll(ResetAllRequest) returns (ResetAllResponse);
  rpc ExportSettings(ExportSettingsRequest) returns (ExportSettingsResponse);
  rpc ImportSettings(ImportSettingsRequest) returns (ImportSettingsResponse);
  rpc RevertSettingsVersion(RevertSettingsVersionRequest) returns (RevertSettingsVersionResponse);
  rpc ListSettingsHistory(ListSettingsHistoryRequest) returns (ListSettingsHistoryResponse);
  rpc WatchSettings(WatchSettingsRequest) returns (stream WatchSettingsResponse);
  // The layout half of this service, added because no method of any other
  // service could fill `layout_documents` or `layout_versions`: a
  // `PublishDocumentDelta` with `SYNCHRONIZED_DOCUMENT_TYPE_LAYOUT` carries a
  // CRDT delta, and merging one needs an engine `apps/control-plane` does not
  // depend on, so it lands in `sync_snapshots` instead. These three methods are
  // the alternative correction C32 named: a whole-document put with an expected
  // revision, its read, and the version log that put appends to.
  rpc PutLayoutDocument(PutLayoutDocumentRequest) returns (PutLayoutDocumentResponse);
  rpc GetLayoutDocument(GetLayoutDocumentRequest) returns (GetLayoutDocumentResponse);
  rpc ListLayoutHistory(ListLayoutHistoryRequest) returns (ListLayoutHistoryResponse);
}
